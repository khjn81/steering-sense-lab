<!doctype html><html lang="ko"><meta charset="utf-8"><title>손 추적 실행 확인</title><body><h1>손 추적 모델 실행 확인</h1><p>카메라를 사용하지 않고 빈 영상으로 실제 WASM 추론을 확인합니다.</p><pre id="result">준비 중…</pre><script type="module">
const result=document.getElementById('result');
const worker=new Worker('/hand-worker.js');
const timeout=setTimeout(()=>{result.textContent+='\nTIMEOUT';worker.terminate();},45000);
worker.onerror=e=>{result.textContent+='\nERROR: '+e.message;clearTimeout(timeout);};
worker.onmessage=async({data})=>{
  if(data.type==='ready'){
    result.textContent='PASS: worker + local WASM + model initialized';
    const canvas=document.createElement('canvas');canvas.width=640;canvas.height=480;
    canvas.getContext('2d').fillRect(0,0,640,480);
    const bitmap=await createImageBitmap(canvas);worker.postMessage({type:'frame',bitmap,timestamp:performance.now()},[bitmap]);
  }
  if(data.type==='hands'){result.textContent+='\nPASS: real video inference returned '+data.landmarks.length+' hands for a blank frame';clearTimeout(timeout);worker.terminate();}
  if(data.type==='error'){result.textContent+='\nERROR: '+data.message;clearTimeout(timeout);worker.terminate();}
};
worker.postMessage({type:'init'});
</script></body></html>
